version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: lynk-esim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lynk_esim
      POSTGRES_USER: lynk
      POSTGRES_PASSWORD: lynk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lynk-esim-app
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env.local
    ports:
      - "3000:3000"

volumes:
  postgres_data:
